<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brochure Editor</title>
<link rel="stylesheet" href="../../../../gcs-design-system/tokens/fonts.css">
<link rel="stylesheet" href="../../../../gcs-design-system/tokens/colors.css">
<link rel="stylesheet" href="../../../../gcs-design-system/tokens/typography.css">
<link rel="stylesheet" href="../../../../gcs-design-system/tokens/spacing.css">
<link rel="stylesheet" href="../../../../gcs-design-system/tokens/radius.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/doc.css">
</head>
<body data-view="editor">

<main id="gallery">
  <header class="top"><img src="../../../../gcs-design-system/assets/logos/GCS-Symbol-White.svg" alt=""><span class="ttl">Brochure Editor</span></header>
  <section class="ghero">
    <h1>Start from a template</h1>
    <p>Pick a brochure layout, edit the content in the sidebar, and export a print-ready A4 PDF. Your drafts are saved in this browser, one per template.</p>
  </section>
  <div class="gsec">Available</div>
  <div class="gall" id="gReady"></div>
  <div class="gsec">Coming soon</div>
  <div class="gall" id="gSoon"></div>
</main>

<div id="app">
  <header class="top">
    <a class="btn" href="#" aria-label="Back to templates">‹ Templates</a>
    <select id="switch" aria-label="Switch template"></select>
    <span class="sp"></span>
    <span id="saved" class="warn bad" role="status" hidden>Draft not saved — storage is full or blocked</span>
    <button id="fit" class="warn" type="button">A4 OK</button>
    <button class="btn" data-act="reset">Reset</button>
    <button class="btn pri" data-act="print">Export PDF</button>
  </header>
  <div class="main">
    <aside class="side" id="structure" aria-label="Structure"></aside>
    <section class="stagewrap" id="stagewrap">
      <div class="tools"><div class="chips" id="chips"></div>
        <button class="sbtn" data-act="fit">Fit width</button>
        <label class="zoom">Zoom <input type="range" id="zoom" min="40" max="130" value="85"></label></div>
      <div class="stage" id="stage"><div id="pages"></div></div>
    </section>
    <aside class="side" id="form" aria-label="Fields"></aside>
  </div>
</div>
<div id="probe" aria-hidden="true"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
