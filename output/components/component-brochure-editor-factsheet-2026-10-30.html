<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brochure Editor — Factsheet</title>
<!-- DS tokens (sibling repo). From output/components/ the DS is ../../../gcs-design-system -->
<link rel="stylesheet" href="../../../gcs-design-system/tokens/fonts.css">
<link rel="stylesheet" href="../../../gcs-design-system/tokens/colors.css">
<link rel="stylesheet" href="../../../gcs-design-system/tokens/typography.css">
<link rel="stylesheet" href="../../../gcs-design-system/tokens/spacing.css">
<link rel="stylesheet" href="../../../gcs-design-system/tokens/radius.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Heebo', 'Helvetica Neue', sans-serif; background: var(--doc-wrapper); color: var(--doc-heading); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }

/* ── app chrome ── */
#app { display: grid; grid-template-rows: 52px 1fr; height: 100%; }
.top { display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--primary); color: var(--primary-foreground); }
.top img { height: 20px; }
.top .ttl { font-weight: 500; font-size: 14px; letter-spacing: .02em; white-space: nowrap; }
.top .sp { flex: 1; }
.top .warn { font-size: 12px; background: #fff2; padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.top .warn.bad { background: #ffb4a8; color: #5a0f05; }
.btn { border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; padding: 7px 12px; border-radius: 6px; font-size: 13px; white-space: nowrap; }
.btn:hover { background: #fff2; }
.btn.pri { background: var(--accent); border-color: var(--accent); }
.zoom { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.zoom input { width: 90px; }
.main { display: grid; grid-template-columns: 390px minmax(0, 1fr); min-height: 0; }
.side { background: var(--card); border-right: 1px solid var(--doc-border); overflow: auto; }
.stage { overflow: auto; padding: 32px 24px 64px; }

/* ── form ── */
details.grp { border-bottom: 1px solid var(--doc-border); }
details.grp > summary { list-style: none; cursor: pointer; padding: 13px 16px; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--primary); display: flex; justify-content: space-between; gap: 8px; }
details.grp > summary .cnt { margin-left: auto; font-weight: 400; letter-spacing: 0; color: var(--doc-muted); }
details.grp > summary::after { content: "+"; color: var(--doc-muted); }
details.grp[open] > summary::after { content: "–"; }
.grp .body { padding: 0 16px 14px; }
.sub { margin: 10px 0 0; padding: 10px; background: var(--doc-surface); border: 1px solid var(--doc-border-soft); border-radius: 6px; }
.subh { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
.subh b { flex: 1; font-size: 11px; color: var(--doc-muted-alt); letter-spacing: .08em; }
.ib { border: 1px solid var(--doc-border-strong); background: #fff; border-radius: 5px; width: 26px; height: 26px; font-size: 13px; line-height: 1; }
.ib:hover:not(:disabled) { background: var(--doc-surface-alt); }
.ib:disabled { opacity: .35; cursor: default; }
.fl { display: block; margin-top: 8px; }
.fl > span { display: block; font-size: 11px; color: var(--doc-muted-alt); margin-bottom: 3px; }
input[type=text], textarea { width: 100%; font: 400 13px/1.4 'Heebo', sans-serif; padding: 7px 9px; border: 1px solid var(--doc-border); border-radius: 5px; background: #fff; color: var(--doc-heading); }
textarea { resize: vertical; }
input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.fl.flash input, .fl.flash textarea { box-shadow: 0 0 0 3px var(--accent); }
.imgrow { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.sbtn { border: 1px solid var(--doc-border-strong); background: #fff; padding: 6px 10px; border-radius: 5px; font-size: 12px; }
.sbtn:hover:not(:disabled) { background: var(--doc-surface); }
.sbtn:disabled { opacity: .4; cursor: default; }
.sbtn.add { width: 100%; margin-top: 10px; border-style: dashed; color: var(--doc-ink-muted); }
.chk { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; }
.iconbtn { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.iconbtn svg, .ipick svg { width: 20px; height: 20px; fill: var(--primary); display: block; }
.ipick { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 4px; margin-top: 8px; padding: 8px; background: #fff; border: 1px solid var(--doc-border); border-radius: 6px; }
.ipick button { border: 1px solid transparent; background: none; border-radius: 5px; height: 34px; display: flex; align-items: center; justify-content: center; }
.ipick button:hover { background: var(--doc-surface-alt); }
.ipick button.on { border-color: var(--accent); background: var(--doc-surface-alt); }
.hint { font-size: 11px; color: var(--doc-muted-alt); margin-top: 6px; }

/* ── preview ── */
#pages { transform-origin: top center; width: 794px; margin: 0 auto; }
#pages [data-f] { cursor: text; }
#pages [data-f]:hover { outline: 1px dashed var(--accent); outline-offset: 2px; }

/* ── print: only the A4 pages ── */
@page { size: 210mm 297mm; margin: 0; }
@media print {
  html, body { height: auto; background: none; }
  #app { display: block; height: auto; }
  .top, .side { display: none !important; }
  .main { display: block; }
  .stage { overflow: visible; padding: 0; }
  #pages { zoom: 1 !important; transform: none !important; width: auto; }
  [data-doc-page] { margin: 0 !important; box-shadow: none !important; border-radius: 0 !important; page-break-after: always; break-after: page; width: 210mm !important; height: 297mm !important; overflow: hidden !important; }
  [data-doc-page]:last-child { page-break-after: auto; break-after: auto; }
  #pages [data-f]:hover { outline: none; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <img src="../../../gcs-design-system/assets/logos/GCS-Symbol-White.svg" alt="">
    <span class="ttl">Brochure Editor · Factsheet</span>
    <span class="sp"></span>
    <span id="fit" class="warn">A4 OK</span>
    <label class="zoom">Zoom <input type="range" id="zoom" min="40" max="130" value="85"></label>
    <button class="btn" data-act="reset">Reset</button>
    <button class="btn pri" data-act="print">Export PDF</button>
  </header>
  <div class="main">
    <aside class="side" id="side"></aside>
    <section class="stage"><div id="pages"></div></section>
  </div>
</div>

const FLAG_ONLINE = 'https://raw.githubusercontent.com/msikma/country-flags/master/flags/png/';
function flagUrls(code) {
  if (!/^[a-z]{2}$/i.test(code || '')) return null;
  const c = code.toLowerCase();

}

/* Pagination: try everything on page 1; while a page overflows, push its last section to the next page.
   A combined overview+benefits section that is too tall on its own is split in two. */
const probe = document.createElement('div');
probe.style.cssText = 'position:absolute;left:-10000px;top:0;width:794px;visibility:hidden;pointer-events:none;';
document.body.appendChild(probe);
const overflowOf = html => { probe.innerHTML = html; const b = probe.querySelector('[data-body]'); return b.scrollHeight - b.clientHeight; };

function paginate(s) {
  const pages = [buildSections(s)], stuck = [];
  for (let p = 0, guard = 0; p < pages.length && guard < 60; p++) {
    for (;;) {
      guard++;
      const secs = pages[p];
      if (overflowOf(pageContent(s, p === 0, secs)) <= 1) break;
      if (secs.length > 1) { (pages[p + 1] = pages[p + 1] || []).unshift(secs.pop()); continue; }
      if (secs.length === 1 && secs[0].split) { pages[p] = secs[0].split.map(h => ({ html: h })); continue; }
      stuck.push(p + 2); break; // single section taller than a page body
    }
  }
  probe.innerHTML = '';
  return { pages, stuck };
}

function renderPages() {
  const { pages, stuck } = paginate(S);
  $('#pages').innerHTML = pageCover(S) + pages.map((secs, i) => pageContent(S, i === 0, secs)).join('') + pageBack();
  checkFit(pages.length + 2, stuck);
}

function checkFit(total, stuck) {
  const el = $('#fit');
  const cut = $$('#pages [style*="line-clamp"]').some(n => n.scrollHeight > n.clientHeight + 1);
  const extra = total > 4 ? ` · ${total} pages` : '';
  if (stuck && stuck.length) { el.className = 'warn bad'; el.textContent = `Page ${stuck[0]}: one section is taller than a page — shorten text${extra}`; }
  else if (cut) { el.className = 'warn bad'; el.textContent = 'A benefit description is cut at 2 lines' + extra; }
  else { el.className = 'warn'; el.textContent = 'A4 OK' + (total ? ` · ${total} pages` : ''); }
}

function readImage(file, max) {
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .85)); };
      im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

  else if (act === 'coverclr') { S.coverImg = ''; changed(); }
  else if (act === 'add') { if (S[d.l].length < L.max) { S[d.l].push(L.add()); openG.add(d.l); changed(); } }
  else if (act === 'del') { if (S[d.l].length > L.min) { S[d.l].splice(i, 1); ui.icon = null; changed(); } }
  else if (act === 'mv') { const j = i + +d.d, A = S[d.l]; if (j >= 0 && j < A.length) { [A[i], A[j]] = [A[j], A[i]]; ui.icon = null; changed(); } }
  else if (act === 'ipick') { ui.icon = ui.icon === d.p ? null : d.p; renderSide(); }
  else if (act === 'iset') { setPath(d.p + '.icon', d.n); ui.icon = null; changed(); }
});

const zoom = $('#zoom');
const applyZoom = () => { $('#pages').style.zoom = zoom.value / 100; try { localStorage.setItem(KEY + '-z', zoom.value); } catch (e) {} };
try { const z = localStorage.getItem(KEY + '-z'); if (z) zoom.value = z; } catch (e) {}
zoom.addEventListener('input', applyZoom);

renderSide(); renderPages(); applyZoom();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderPages);
})();
</script>
