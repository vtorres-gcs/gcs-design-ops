<!-- COMPONENT: pull-quote
     Single memorable quote with left-border accent and optional photo avatar.
     Two variants: (A) sidebar-style with border-left accent box, (B) photo + quote row.
     Use variant A when no photo is available; variant B when a headshot is available.

     WHEN TO USE:
       Client testimonial, expert opinion, CEO/advisor quote on a content page.
       Almost always paired with narrative or stat-strip on the same page — rarely fills
       a full page alone. Place it at the bottom of the page for visual anchor.
       Avoid for quotes longer than 60 words; avoid for data points (use stat-strip instead).

     PARAMETERS:
       quote       — Verbatim quote text. Do NOT add quotation marks — they are added by the CSS.
       attribution — Attribution line: "— First Last, Title · Year" or "— GCS Client, Country · Year"
       photoSrc    — (Variant B only) absolute path or URL to headshot; 72×72px displayed as circle
       photoAlt    — (Variant B only) alt text for accessibility

     HEIGHT ESTIMATE:
       Variant A (no photo): ~120–160px for a 2–3 sentence quote
       Variant B (with photo): ~140–180px

     SOURCE: extracted from case-study page 2, quarterly-report page 3, lead-magnet page 5. -->

<!-- ── VARIANT A: Border-left accent box (no photo) ──────────── -->
<div data-component="pull-quote" style="padding: 0 64px 48px; flex-shrink: 0;">
  <div style="border-left: 3px solid #3D51E8; padding: 20px 24px; background: #F2F3FE; border-radius: 0 4px 4px 0;">
    <div style="font-family: 'Yrsa', serif; font-weight: 400; font-style: italic; font-size: 20px; color: #000957; line-height: 1.5; margin-bottom: 10px;">"QUOTE_TEXT"</div>
    <div style="font-family: 'Heebo', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #6F7185;">ATTRIBUTION</div>
  </div>
</div>

<!-- ── VARIANT B: Photo avatar + quote row ────────────────────
     Replace Variant A above with this block when a headshot is available.

<div data-component="pull-quote" style="padding: 0 64px 48px; flex-shrink: 0;">
  <div style="display: flex; gap: 28px; align-items: flex-start; padding: 36px 0 0; border-top: 1px solid #ECEDF5;">
    <div style="width: 72px; height: 72px; border-radius: 50%; flex-shrink: 0; overflow: hidden; background: #E8EAF2;">
      <img src="PHOTO_SRC" alt="PHOTO_ALT" style="width: 100%; height: 100%; object-fit: cover; object-position: center top;">
    </div>
    <div style="flex: 1;">
      <div style="font-family: 'Yrsa', serif; font-weight: 400; font-style: italic; font-size: 22px; color: #16182A; line-height: 1.5; margin-bottom: 16px;">QUOTE_TEXT</div>
      <div style="font-family: 'Heebo', sans-serif; font-size: 11px; font-weight: 700; color: #000957; letter-spacing: 0.04em;">ATTRIBUTION</div>
    </div>
  </div>
</div>
──────────────────────────────────────────────────────────────── -->
