<!-- COMPONENT: month-grid
     12-month publication calendar grid — 3 columns × 4 rows, each cell showing a month's
     events with colour-coded dot indicators (Report/Briefing/Index).
     GIU sub-brand only — use exclusively in GIU Calendar brochures.

     WHEN TO USE:
       Annual GIU publication schedule page.
       Any calendar-style overview where events are organised by month.
       This component fills a full content page on its own.

     COLOUR CODING (dot colours):
       #000957  Report        — major annual/quarterly research reports
       #3D51E8  Briefing      — shorter intelligence briefings
       #7B8FFF  Index         — ranking or index publications
     The current month (or highlighted publication) uses a Night Blue border + #F7F8FD bg.

     PARAMETERS:
       calYear     — 4-digit year for the header label (e.g. "2026")
       gridHeading — Yrsa heading (e.g. "A Year of Intelligence")
       MONTH_NAME  — Each month cell: replace event text and choose the right dot colour.
                     Clone the event item <div> inside a month cell for multiple events.
                     To highlight a month (e.g. the current one): change border to
                     "1.5px solid #000957" and background to #F7F8FD.

     HEIGHT: fills the content area (~1023px) — do not combine with other components.

     SOURCE: extracted from giu-calendar page 2. -->

<div data-component="month-grid" style="padding: 28px 56px 24px; flex: 1; display: flex; flex-direction: column; overflow: hidden;">

  <!-- Header -->
  <div style="margin-bottom: 16px; flex-shrink: 0;">

    <div style="font-family: 'Yrsa', serif; font-weight: 400; font-size: 36px; color: #16182A; line-height: 1.08; letter-spacing: -0.6px;">GRID_HEADING</div>
  </div>

  <!-- Legend -->

    <div style="display: flex; align-items: center; gap: 7px;">
      <div style="width: 10px; height: 10px; border-radius: 2px; background: #000957; flex-shrink: 0;"></div>
      <span style="font-family: 'Heebo', sans-serif; font-size: 10px; font-weight: 500; color: #6F7185; letter-spacing: 0.04em;">Report</span>
    </div>
    <div style="display: flex; align-items: center; gap: 7px;">
      <div style="width: 10px; height: 10px; border-radius: 2px; background: #3D51E8; flex-shrink: 0;"></div>
      <span style="font-family: 'Heebo', sans-serif; font-size: 10px; font-weight: 500; color: #6F7185; letter-spacing: 0.04em;">Briefing</span>

    <div style="display: flex; align-items: center; gap: 7px;">
