<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Letterhead" description="A4 formal letter with branded header and footer" -->
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yrsa:ital,wght@0,400;0,500;1,400;1,500&amp;family=Heebo:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<script src="./ds-base.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

@page { size: 210mm 297mm; margin: 0; }

@media print {
  html, body { margin: 0 !important; padding: 0 !important; }
  [data-doc-wrapper] {
    background: none !important;
    padding: 0 !important;
    min-height: unset !important;
  }
  [data-doc-page] {
    margin: 0 !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    page-break-after: always;
    break-after: page;
    width: 210mm !important;
    height: 297mm !important;
    min-height: unset !important;
    overflow: hidden !important;
    position: relative !important;
  }
  [data-doc-page]:last-child {
    page-break-after: auto;
    break-after: auto;
  }
}
</style>
</helmet>

<div data-doc-wrapper="" style="background: var(--doc-wrapper); padding: 40px 24px; min-height: 100vh; font-family: 'Heebo', 'Helvetica Neue', sans-serif;">

  <!-- ── A4 LETTERHEAD PAGE ─────────────────────────────── -->
  <div data-doc-page="" style="width: 794px; min-height: 1123px; margin: 0 auto; background: var(--card); border-radius: 2px; box-shadow: 0 4px 24px rgba(0,9,87,0.12); display: flex; flex-direction: column; overflow: hidden;">

    <!-- HEADER -->
    <div style="padding: 95px 95px 28px; display: flex; justify-content: space-between; align-items: flex-start; flex-shrink: 0;">
      <img src="../../../assets/logos/GCS-Primary-Blue.svg" style="height: 50px; width: 139px; margin-top: 2px">

    </div>

    <!-- HEADER RULE (same color as footer rule) -->
    <div style="border-top: 1px solid var(--doc-border); margin: 0 95px; flex-shrink: 0;"></div>

    <!-- BODY -->
    <div style="padding: 40px 95px 32px; flex: 1; display: flex; flex-direction: column;">

      <!-- Date -->
      <div style="font-family: 'Heebo', sans-serif; font-size: 16px; font-weight: 400; color: var(--doc-muted-alt); line-height: 1.15; margin-bottom: 32px;">{{ date }}</div>

      <!-- Recipient -->
      <div style="margin-bottom: 36px;">
        <div style="font-family: 'Heebo', sans-serif; font-size: 16px; font-weight: 500; color: var(--doc-heading); line-height: 1.15;">{{ recipientName }}</div>
        <div style="font-family: 'Heebo', sans-serif; font-size: 16px; font-weight: 400; color: #4E516A; line-height: 1.15;">{{ recipientTitle }}</div>
        <div style="font-family: 'Heebo', sans-serif; font-size: 16px; font-weight: 400; color: #4E516A; line-height: 1.15;">{{ recipientOrg }}</div>
        <div style="font-family: 'Heebo', sans-serif; font-size: 16px; font-weight: 400; color: #4E516A; line-height: 1.15;">{{ recipientAddress }}</div>
      </div>

      <!-- Subject -->
      <div style="margin-bottom: 32px;">
        <span style="font-family: 'Heebo', sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--primary);">Re: </span>
        <span style="font-family: 'Yrsa', serif; font-size: 19px; font-weight: 500; color: var(--doc-heading); letter-spacing: -0.2px;">{{ subject }}</span>
      </div>

      <!-- Salutation -->
      <div style="font-family: 'Heebo', sans-serif; font-size: 16px; font-weight: 400; color: #252839; line-height: 1.15; margin-bottom: 20px;">Dear {{ salutation }},</div>

      <!-- Body paragraphs -->
      <div style="font-family: 'Heebo', sans-serif; font-size: 16px; font-weight: 300; color: #343750; line-height: 1.15; text-align: justify; margin-bottom: 20px;">{{ body1 }}</div>
      <div style="font-family: 'Heebo', sans-serif; font-size: 16px; font-weight: 300; color: #343750; line-height: 1.15; text-align: justify; margin-bottom: 20px;">{{ body2 }}</div>
      <div style="font-family: 'Heebo', sans-serif; font-size: 16px; font-weight: 300; color: #343750; line-height: 1.15; text-align: justify; margin-bottom: 40px;">{{ body3 }}</div>

      <!-- Closing -->
      <div style="font-family: 'Heebo', sans-serif; font-size: 16px; font-weight: 400; color: #252839; line-height: 1.15; margin-bottom: 52px;">{{ closing }},</div>

      <!-- Signature block -->
      <div>
        <div style="width: 100px; height: 1px; background: var(--doc-border); margin-bottom: 14px;"></div>
        <div style="font-family: 'Yrsa', serif; font-size: 18px; font-weight: 500; color: var(--doc-heading); margin-bottom: 2px;">{{ senderName }}</div>
        <div style="font-family: 'Heebo', sans-serif; font-size: 16px; font-weight: 400; color: var(--doc-muted-alt); line-height: 1.15; margin-bottom: 1px;">{{ senderTitle }}</div>
        <div style="font-family: 'Heebo', sans-serif; font-size: 16px; font-weight: 400; color: var(--primary); line-height: 1.15;">Global Citizen Solutions</div>
      </div>

    </div>

    <!-- FOOTER RULE -->
    <div style="border-top: 1px solid var(--doc-border); margin: 0 95px; flex-shrink: 0;"></div>

    <!-- FOOTER (footnote text, min 10pt) -->
    <div style="padding: 18px 95px 95px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
      <div style="font-family: 'Heebo', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 0.1em; color: var(--doc-subtle)">GLOBALCITIZENSOLUTIONS.COM</div><div>

      </div>
      <div style="text-align: center;">

      </div>
      <div>

      </div><span style="font-family: 'Heebo', sans-serif; font-size: 10px; font-weight: 400; color: var(--doc-subtle); letter-spacing: 0.08em">01</span>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 860, &quot;height&quot;: 1160},
  &quot;date&quot;:             {&quot;editor&quot;: &quot;text&quot;,  &quot;default&quot;: &quot;June 17, 2026&quot;},
  &quot;recipientName&quot;:    {&quot;editor&quot;: &quot;text&quot;,  &quot;default&quot;: &quot;[Recipient Name]&quot;},
  &quot;recipientTitle&quot;:   {&quot;editor&quot;: &quot;text&quot;,  &quot;default&quot;: &quot;[Title]&quot;},
  &quot;recipientOrg&quot;:     {&quot;editor&quot;: &quot;text&quot;,  &quot;default&quot;: &quot;[Organisation]&quot;},
  &quot;recipientAddress&quot;: {&quot;editor&quot;: &quot;text&quot;,  &quot;default&quot;: &quot;[City, Country]&quot;},
  &quot;subject&quot;:          {&quot;editor&quot;: &quot;text&quot;,  &quot;default&quot;: &quot;Portugal Golden Visa — Application Update&quot;},
  &quot;salutation&quot;:       {&quot;editor&quot;: &quot;text&quot;,  &quot;default&quot;: &quot;[Mr / Ms Last Name]&quot;},
  &quot;body1&quot;:            {&quot;editor&quot;: &quot;text&quot;,  &quot;default&quot;: &quot;We are writing to provide you with an update regarding your application under the Portugal Golden Visa Programme.&quot;},
  &quot;body2&quot;:            {&quot;editor&quot;: &quot;text&quot;,  &quot;default&quot;: &quot;Our legal team will continue to monitor the progress of your application and will notify you promptly of any developments.&quot;},
  &quot;body3&quot;:            {&quot;editor&quot;: &quot;text&quot;,  &quot;default&quot;: &quot;Should you have any questions, please do not hesitate to contact your dedicated GCS advisor directly.&quot;},
  &quot;closing&quot;:          {&quot;editor&quot;: &quot;text&quot;,  &quot;default&quot;: &quot;Yours sincerely&quot;},
  &quot;senderName&quot;:       {&quot;editor&quot;: &quot;text&quot;,  &quot;default&quot;: &quot;[Name Surname]&quot;},
  &quot;senderTitle&quot;:      {&quot;editor&quot;: &quot;text&quot;,  &quot;default&quot;: &quot;[Job Title]&quot;}
}">
class Component extends DCLogic {
  renderVals() {
    return {
      date:             this.props.date             ?? 'June 17, 2026',
      recipientName:    this.props.recipientName    ?? '[Recipient Name]',
      recipientTitle:   this.props.recipientTitle   ?? '[Title]',
      recipientOrg:     this.props.recipientOrg     ?? '[Organisation]',
      recipientAddress: this.props.recipientAddress ?? '[City, Country]',
      subject:          this.props.subject          ?? 'Portugal Golden Visa — Application Update',
      salutation:       this.props.salutation       ?? '[Mr / Ms Last Name]',
      body1:            this.props.body1            ?? 'We are writing to provide you with an update regarding your application under the Portugal Golden Visa Programme. Following the recent submission of your documentation to the Agência para a Integração, Migrações e Asilo (AIMA), we are pleased to confirm that your file has been accepted and is now under active review.',
      body2:            this.props.body2            ?? 'Our legal team will continue to monitor the progress of your application and will notify you promptly of any developments or requests from the authorities. In the meantime, we recommend ensuring that all travel documents remain valid and that no changes are made to your primary address of residence without prior notification to our team.',
      body3:            this.props.body3            ?? 'Should you have any questions or require further clarification at any stage of the process, please do not hesitate to contact your dedicated GCS advisor directly. We remain committed to providing you with the highest level of support throughout your residency journey.',
      closing:          this.props.closing          ?? 'Yours sincerely',
      senderName:       this.props.senderName       ?? '[Name Surname]',
      senderTitle:      this.props.senderTitle      ?? '[Job Title]',
    };
  }
}
</script>
</body>
</html>
